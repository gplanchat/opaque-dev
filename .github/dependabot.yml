# Version-update pull requests, weekly: the root manifest (the packages' dev tooling) and the
# actions the workflows pin by tag. Security alerts are on regardless of this file.
version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule: { interval: weekly, day: monday }
      open-pull-requests-limit: 5
    - package-ecosystem: github-actions
      directory: /
      schedule: { interval: weekly, day: monday }
