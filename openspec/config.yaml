schema: spec-driven

context: |
  PHP 8.2+ component of opaque value objects: secrets that refuse to leak through dumps,
  exports, serialize(), string casts and reflection-based normalizers, ciphered value objects
  (libsodium) that may be stored, and a Symfony Serializer bridge. The motivating host is
  gplanchat/durable, whose journal JSON-encodes payloads and compares them on replay (OPQ002). Framework-free core (gplanchat/opaque); the bridge is a separate package.

  Normative documentation is English (WA001). Development is TDD, Red then Green then
  Refactor (WA002). Architecture decisions live in documentation/adr/ as ADRs with OPQxxx
  identifiers; a change that lands should leave an ADR behind.

  House rule: a leak is a behaviour. A requirement that a channel is closed comes with a
  scenario that opens the channel and looks for the secret in what comes out.

rules:
  spec:
    - Scenarios must be observable from outside the component, never internal class names
    - Every scenario about a closed channel states what the output must not contain
  design:
    - State which channels stay open, and why, rather than leaving them unmentioned
